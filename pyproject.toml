[project]
name = "trustworthy-agent"
version = "0.0.1"
description = "Pre-registered testbed measuring authorization-scope propagation and its cost at the A2A→MCP boundary (cross-protocol confused deputy, TV23)"
authors = [{ name = "Yixian Jiang" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "cryptography>=42.0",
  "numpy>=1.26",
  "scipy>=1.11",
  # Exact pin — verified by gate G-1 (ADR 0002); any version bump re-triggers G-1.
  "biscuit-python==0.4.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

# PENDING GATE — do not pin until the gate decides:
#   authlib (RFC 8693 + RFC 9396)     -> gate G-4
#   DPoP / JOSE library               -> gate G-5

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
