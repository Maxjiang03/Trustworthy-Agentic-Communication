name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Determinism control (design Part J.1 / CLAUDE.md Setup).
  PYTHONHASHSEED: "0"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Sync pinned environment
        run: uv sync

      - name: Lint (pre-commit — ruff + ruff-format)
        run: uvx pre-commit run --all-files

      - name: Test
        run: uv run pytest -q
