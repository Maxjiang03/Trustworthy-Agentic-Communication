name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Determinism control (design Part J.1 / CLAUDE.md Setup).
  PYTHONHASHSEED: "0"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Sync pinned environment (locked)
        run: uv sync --frozen

      - name: Lint (pre-commit — ruff + ruff-format)
        run: uvx pre-commit run --all-files

      - name: Test
        run: uv run pytest -q

      # The G-4 spike stands up the experiment AS on a loopback TLS 1.3 socket
      # and spawns a separate agent process, so unlike the Windows-only effect
      # ledger (ADR 0014) it must hold on both platforms. Run here so that is
      # confirmed rather than assumed. Other gates' spikes stay out: G-7's
      # depends on Win32 exclusive-share semantics by decision.
      - name: Gate G-4 spike (cross-platform)
        run: uv run python smoke/g4/spike.py

      # The G-11 spike is pure signing and hashing, so it is platform-independent
      # for the same reason: run it here rather than assume it.
      - name: Gate G-11 spike (cross-platform)
        run: uv run python smoke/g11/spike.py

      # The G-13 spike touches the AS and Biscuit but never the effect ledger,
      # so it is platform-independent by the same argument -- confirmed here
      # rather than assumed. It runs every strong arm over the pilot corpus, so
      # a change that quietly breaks matched per-hop authority fails CI.
      - name: Gate G-13 spike (cross-platform)
        run: uv run python smoke/g13/spike.py

      # G-15 touches the frozen policy, the arms and the boundary but NOT the
      # effect ledger, so it is platform-independent for the same reason as the
      # three above -- confirmed by running it here rather than assumed. It runs
      # all nine arms over the F4/F5 fixtures under BOTH monitor configurations,
      # so a change that quietly made the shared monitor unreachable from an
      # OAuth arm, or that let a cell be recorded without its configuration,
      # fails CI.
      - name: Gate G-15 spike (cross-platform)
        run: uv run python smoke/g15/spike.py

      # G-12's structural limbs (the oracle-independence AST scan, the
      # log_integrity_failure behaviour, and the four correlation-fault
      # predicates) are pure computation and run everywhere. Its ledger-backed
      # limbs report NOT ADJUDICATED on POSIX rather than passing -- ADR 0014,
      # the ledger does not degrade -- so this step confirms what it can and
      # never launders a Windows-only property into a green Linux tick.
      - name: Gate G-12 spike (structural limbs cross-platform)
        run: uv run python smoke/g12/spike.py

      # G-9 is cross-platform by construction (ADR 0033: loopback sockets and a
      # spawned arbiter, deliberately NOT an OS primitive that would have made
      # the replay cache Windows-only). It fills the frozen 2^16 capacity, so
      # it is the longest of the spikes and still well under a minute.
      - name: Gate G-9 spike (cross-platform)
        run: uv run python smoke/g9/spike.py

      # G-14 attaches the shared authenticated-request-id cache to B2-DPoP and
      # B3 and runs SS D's taxonomy. No effect ledger, so it is cross-platform
      # like the rest -- and it is the gate that turns the DPoP/INV attribution
      # from an argument into a measurement.
      - name: Gate G-14 spike (cross-platform)
        run: uv run python smoke/g14/spike.py
